<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071019">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>StreetRush</title>
</head>
<body>
  <div id="game"></div>
  <div id="hud"><b>STREET<span>RUSH</span></b><div id="stats">LAP 1/3 &nbsp; POS 1/6 &nbsp; <span id="time">00:00.0</span></div><div id="speed">0 <small>KM/H</small></div></div>
  <div id="count"></div>
  <div id="controls"><button id="left">◀</button><button id="brake">BRAKE</button><button id="gas">GAS</button><button id="right">▶</button></div>
  <div id="start" class="screen"><section><h1>STREET<span>RUSH</span></h1><p>REALISTIC CIRCUIT RACING</p><button id="startBtn">START RACE</button><small>Mobile racing • 3 laps • 6 cars</small></section></div>
  <div id="finish" class="screen hidden"><section><h1>FINISH</h1><h2 id="result">RACE COMPLETE</h2><p id="final"></p><button id="again">RACE AGAIN</button></section></div>
  <script type="module" src="/src/game.js"></script>
</body>
</html>
